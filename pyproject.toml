[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binario-marketing-app"
dynamic = ["version"]
description = "Git-first reconstructed canonical source for BINARIO Marketing App"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
binario-marketing = "binario_marketing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "binario_marketing.version.__version__"}
