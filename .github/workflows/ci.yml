name: Canonical Source CI

on:
  push:
    branches: [main, "recovery/**", "wave/**", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  source-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Source tree contract
        run: python scripts/check_source_tree.py
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q src
      - name: Source snapshot
        run: python scripts/source_snapshot.py > SOURCE_MANIFEST.json
      - uses: actions/upload-artifact@v4
        with:
          name: source-manifest-${{ matrix.os }}
          path: SOURCE_MANIFEST.json
          if-no-files-found: error
