name: Full Mac Delivery · current arm64

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "apps/**"
      - "web/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/full-mac-delivery-current.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-mac-delivery-current-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-delivery-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache verified FFmpeg runtime
        uses: actions/cache@v4
        with:
          path: .cache/full-mac-media-arm64
          key: ffmpeg-8.1.2-${{ runner.os }}-arm64-38b88335f99e76ed89ff3c93f877fdefce736c13

      - name: Cache verified Whisper runtime
        uses: actions/cache@v4
        with:
          path: .cache/full-mac-whisper-arm64
          key: whisper-${{ runner.os }}-arm64-${{ hashFiles('scripts/full_mac_transcription_runtime.env') }}

      - name: Build current arm64 app
        shell: bash
        env:
          FULL_MAC_FFMPEG_CACHE_DIR: ${{ github.workspace }}/.cache/full-mac-media-arm64
          FULL_MAC_WHISPER_CACHE_DIR: ${{ github.workspace }}/.cache/full-mac-whisper-arm64
        run: |
          set -euo pipefail
          chmod +x scripts/bootstrap_full_mac_python.sh scripts/build_embedded_ffmpeg.sh scripts/build_embedded_whisper.sh scripts/build_full_mac_app.sh scripts/build_full_mac_current.sh scripts/audit_full_mac_app.sh scripts/audit_wave47_product_surface.sh scripts/audit_wave48_paid_media_center.sh scripts/audit_embedded_whisper.sh
          scripts/build_full_mac_current.sh --arch arm64

      - name: Audit exact delivery bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/Binario Marketing IA.app"
          scripts/audit_full_mac_app.sh "$APP"
          scripts/audit_wave47_product_surface.sh "$APP"
          scripts/audit_wave48_paid_media_center.sh "$APP"
          scripts/audit_embedded_whisper.sh "$APP" arm64
          grep -q 'service_wave48_app import serve' "$APP/Contents/Resources/launch.py"

      - name: Minimal boot check
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/Binario Marketing IA.app"
          DATA="$RUNNER_TEMP/binario-delivery-smoke"
          BASE="http://127.0.0.1:18766"
          LOG="$RUNNER_TEMP/binario-delivery.log"
          BINARIO_IA_HOME="$DATA" BINARIO_NO_BROWSER=1 BINARIO_PORT=18766 "$APP/Contents/MacOS/Binario Marketing IA" >"$LOG" 2>&1 &
          PID=$!
          cleanup(){ kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; }
          trap cleanup EXIT
          READY=0
          for _ in $(seq 1 80); do
            if curl --fail --silent "$BASE/api/health" > "$RUNNER_TEMP/health.json"; then READY=1; break; fi
            sleep 0.25
          done
          if [[ "$READY" != "1" ]]; then cat "$LOG"; exit 1; fi
          grep -q '"status":"ok"' "$RUNNER_TEMP/health.json"
          curl --fail --silent "$BASE/paid-media-center.js" > "$RUNNER_TEMP/paid-media-center.js"
          grep -q 'PAID MEDIA CENTER' "$RUNNER_TEMP/paid-media-center.js"
          echo 'WAVE 48 DELIVERY BOOT PASS'

      - name: Package exact Wave 48 delivery
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Binario-Marketing-IA-W48-arm64-${GITHUB_SHA::12}.zip"
          TREE="$(git rev-parse HEAD^{tree})"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "dist/Binario Marketing IA.app" "$ZIP"
          SHA="$(/usr/bin/shasum -a 256 "$ZIP" | /usr/bin/awk '{print $1}')"
          printf '%s  %s\n' "$SHA" "$ZIP" > "$ZIP.sha256"
          printf '{"git_sha":"%s","source_tree":"%s","architecture":"arm64","artifact":"%s","artifact_sha256":"%s","wave":48,"entrypoint":"service_wave48_app","ffmpeg":"8.1.2","ffmpeg_commit":"38b88335f99e76ed89ff3c93f877fdefce736c13"}\n' "$GITHUB_SHA" "$TREE" "$ZIP" "$SHA" > FULL_MAC_DELIVERY.json

      - name: Upload Wave 48 arm64 delivery
        uses: actions/upload-artifact@v4
        with:
          name: binario-marketing-wave48-arm64
          path: |
            Binario-Marketing-IA-W48-arm64-*.zip
            Binario-Marketing-IA-W48-arm64-*.zip.sha256
            FULL_MAC_DELIVERY.json
          if-no-files-found: error
