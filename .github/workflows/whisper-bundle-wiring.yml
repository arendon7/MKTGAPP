name: Whisper Bundle Atomic Wiring

on:
  push:
    branches: [feature/auto-transcription-clipper]
    paths: [.github/workflows/whisper-bundle-wiring.yml]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wire embedded transcription runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          transcription=Path('src/binario_marketing/video/transcription.py')
          text=transcription.read_text(encoding='utf-8')
          if 'import sys\n' not in text:text=text.replace('import shutil\n','import shutil\nimport sys\n',1)
          old='''def resolve_whisper_cli(explicit:str|None=None) -> str:\n    candidate=explicit or os.environ.get('BINARIO_WHISPER_CLI') or shutil.which('whisper-cli')\n    if not candidate:raise FileNotFoundError('whisper.cpp CLI runtime is unavailable')\n    return candidate\n\n\ndef resolve_whisper_model(explicit:str|None=None) -> str:\n    candidate=explicit or os.environ.get('BINARIO_WHISPER_MODEL')\n    if not candidate:raise FileNotFoundError('whisper.cpp model is unavailable')\n    path=Path(candidate)\n    if not path.is_file():raise FileNotFoundError(path)\n    return str(path)\n'''
          new='''def _embedded_runtime_file(relative:str) -> Path | None:\n    executable=Path(sys.executable).resolve()\n    if len(executable.parents)>=3:\n        runtime=executable.parents[2]\n        if runtime.name=='runtime':\n            candidate=runtime/relative\n            if candidate.is_file():return candidate\n    return None\n\n\ndef resolve_whisper_cli(explicit:str|None=None) -> str:\n    candidate=explicit or os.environ.get('BINARIO_WHISPER_CLI')\n    if not candidate:\n        embedded=_embedded_runtime_file('transcription/bin/whisper-cli')\n        candidate=str(embedded) if embedded is not None else shutil.which('whisper-cli')\n    if not candidate:raise FileNotFoundError('whisper.cpp CLI runtime is unavailable')\n    return candidate\n\n\ndef resolve_whisper_model(explicit:str|None=None) -> str:\n    candidate=explicit or os.environ.get('BINARIO_WHISPER_MODEL')\n    if not candidate:\n        embedded=_embedded_runtime_file('transcription/models/ggml-tiny.bin')\n        candidate=str(embedded) if embedded is not None else None\n    if not candidate:raise FileNotFoundError('whisper.cpp model is unavailable')\n    path=Path(candidate)\n    if not path.is_file():raise FileNotFoundError(path)\n    return str(path)\n'''
          if old in text:text=text.replace(old,new,1)
          elif '_embedded_runtime_file' not in text:raise SystemExit('transcription resolver anchor missing')
          transcription.write_text(text,encoding='utf-8')

          builder=Path('scripts/build_full_mac_app.sh');text=builder.read_text(encoding='utf-8')
          if 'build_embedded_whisper.sh' not in text:
              text += '''\n\n# Pinned local transcription runtime: added after the canonical app bundle is assembled.\nTRANSCRIPTION_REPO_ROOT="$(cd "$(dirname "$0")/.." && pwd)"\nTRANSCRIPTION_RUNTIME_DIR="$TRANSCRIPTION_REPO_ROOT/dist/Binario Marketing IA.app/Contents/Resources/runtime/transcription"\nFULL_MAC_WHISPER_CACHE_DIR="${FULL_MAC_WHISPER_CACHE_DIR:-$TRANSCRIPTION_REPO_ROOT/.cache/full-mac-whisper-$ARCH}" \\\n  bash "$TRANSCRIPTION_REPO_ROOT/scripts/build_embedded_whisper.sh" --arch "$ARCH" --output "$TRANSCRIPTION_RUNTIME_DIR"\nbash "$TRANSCRIPTION_REPO_ROOT/scripts/audit_embedded_whisper.sh" "$TRANSCRIPTION_REPO_ROOT/dist/Binario Marketing IA.app" "$ARCH"\n'''
              builder.write_text(text,encoding='utf-8')

          workflow=Path('.github/workflows/full-mac-app.yml');text=workflow.read_text(encoding='utf-8')
          if 'Cache verified Whisper runtime' not in text:
              marker='''      - name: Build native app\n'''
              cache='''      - name: Cache verified Whisper runtime\n        uses: actions/cache@v4\n        with:\n          path: .cache/full-mac-whisper-${{ matrix.arch }}\n          key: whisper-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('scripts/full_mac_transcription_runtime.env') }}\n'''
              if marker not in text:raise SystemExit('FULL MAC build step anchor missing')
              text=text.replace(marker,cache+marker,1)
          env_anchor='''          FULL_MAC_FFMPEG_CACHE_DIR: ${{ github.workspace }}/.cache/full-mac-media-${{ matrix.arch }}\n'''
          env_new=env_anchor+'''          FULL_MAC_WHISPER_CACHE_DIR: ${{ github.workspace }}/.cache/full-mac-whisper-${{ matrix.arch }}\n'''
          if 'FULL_MAC_WHISPER_CACHE_DIR:' not in text:
              if env_anchor not in text:raise SystemExit('FULL MAC env anchor missing')
              text=text.replace(env_anchor,env_new,1)
          audit_anchor='''      - name: Smoke boot and render through bundled API\n'''
          audit='''      - name: Audit embedded local transcription runtime\n        shell: bash\n        run: bash scripts/audit_embedded_whisper.sh "dist/Binario Marketing IA.app" "${{ matrix.arch }}"\n'''
          if 'Audit embedded local transcription runtime' not in text:
              if audit_anchor not in text:raise SystemExit('FULL MAC smoke anchor missing')
              text=text.replace(audit_anchor,audit+audit_anchor,1)
          sequence='''          bash scripts/smoke_full_mac_sequence.sh "$BASE" "$PY" "$MEDIA" "$RUNNER_TEMP"\n'''
          transcription_smoke=sequence+'''          bash scripts/smoke_full_mac_transcription.sh "$BASE" "$PY" "$MEDIA" "$RUNNER_TEMP"\n'''
          if 'smoke_full_mac_transcription.sh' not in text:
              if sequence not in text:raise SystemExit('sequence smoke anchor missing')
              text=text.replace(sequence,transcription_smoke,1)
          workflow.write_text(text,encoding='utf-8')
          PY
      - name: Validate standalone transcription wiring
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python scripts/check_source_tree.py
          for script in scripts/*.sh; do bash -n "$script"; done
          for script in web/*.js; do node --check "$script"; done
          python -m unittest discover -s tests -v
          python -m compileall -q src scripts
      - name: Commit validated wiring and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/whisper-bundle-wiring.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "runtime: bundle pinned local whisper transcription in Mac app"
          git push origin HEAD:feature/auto-transcription-clipper
