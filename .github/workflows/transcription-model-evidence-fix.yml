name: Transcription Model Evidence Fix

on:
  push:
    branches: [feature/auto-transcription-clipper]
    paths: [.github/workflows/transcription-model-evidence-fix.yml]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch model evidence resolution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          manager=Path('src/binario_marketing/transcription_manager.py');text=manager.read_text(encoding='utf-8')
          text=text.replace('from .video.transcription import SpeechSegment,extract_audio_command,load_whisper_output,transcript_sha256,whisper_command','from .video.transcription import SpeechSegment,extract_audio_command,load_whisper_output,resolve_whisper_model,transcript_sha256,whisper_command')
          old='''    def _model_sha(self)->str|None:\n        if self._model_sha_cache:return self._model_sha_cache\n        candidate=self.model or os.environ.get('BINARIO_WHISPER_MODEL')\n        if candidate and Path(candidate).is_file():self._model_sha_cache=_sha256_file(Path(candidate));return self._model_sha_cache\n        return None\n'''
          new='''    def _model_sha(self)->str|None:\n        if self._model_sha_cache:return self._model_sha_cache\n        try:\n            candidate=resolve_whisper_model(self.model)\n        except FileNotFoundError:\n            return None\n        self._model_sha_cache=_sha256_file(Path(candidate))\n        return self._model_sha_cache\n'''
          if old in text:text=text.replace(old,new,1)
          elif 'candidate=resolve_whisper_model(self.model)' not in text:raise SystemExit('model sha anchor missing')
          manager.write_text(text,encoding='utf-8')

          contract=Path('tests/test_transcription_runtime_contract.py');text=contract.read_text(encoding='utf-8')
          text=text.replace("'runtime/transcription/bin/whisper-cli'","'transcription/bin/whisper-cli'")
          text=text.replace("'runtime/transcription/models'","'transcription/models/ggml-tiny.bin'")
          contract.write_text(text,encoding='utf-8')

          tests=Path('tests/test_transcription.py');text=tests.read_text(encoding='utf-8')
          needle="self.assertEqual(row.language,'es');self.assertEqual(row.segments_count,3);self.assertAlmostEqual(row.duration,14.0)"
          replacement=needle+";self.assertEqual(row.model_sha256,_sha256_file_for_test(self.model))"
          if '_sha256_file_for_test' not in text:
              text=text.replace('import json\n','import hashlib\nimport json\n',1)
              text=text.replace("FAKE_FFMPEG=r'''", "def _sha256_file_for_test(path):\n    return hashlib.sha256(Path(path).read_bytes()).hexdigest()\n\n\nFAKE_FFMPEG=r'''",1)
          if replacement not in text:
              if needle not in text:raise SystemExit('transcription evidence test anchor missing')
              text=text.replace(needle,replacement,1)
          tests.write_text(text,encoding='utf-8')
          PY
      - name: Validate evidence fix
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do bash -n "$script"; done
          for script in web/*.js; do node --check "$script"; done
          python -m unittest discover -s tests -v
          python -m compileall -q src scripts
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/transcription-model-evidence-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: hash the resolved embedded Whisper model in transcript evidence"
          git push origin HEAD:feature/auto-transcription-clipper
