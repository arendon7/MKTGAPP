name: Clipper Modes Atomic Wiring

on:
  push:
    branches: [feature/clipper-narrative-modes]
    paths: [.github/workflows/clipper-modes-wiring.yml]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wire narrative selection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          service=Path('src/binario_marketing/service.py');text=service.read_text(encoding='utf-8')
          if 'from .clipper_service import select_clips_payload' not in text:text=text.replace('from .config import default_paths\n','from .config import default_paths\nfrom .clipper_service import select_clips_payload\n',1)
          old='''                    segments = [TranscriptSegment(float(row["start"]), float(row["end"]), str(row["text"])) for row in payload.get("segments", [])]\n                    self._json([asdict(item) for item in select_clips(segments, int(payload.get("target_count", 3)), float(payload.get("min_duration", 15)), float(payload.get("max_duration", 75)))])\n'''
          new='''                    segments = [TranscriptSegment(float(row["start"]), float(row["end"]), str(row["text"])) for row in payload.get("segments", [])]\n                    self._json(select_clips_payload(segments, payload))\n'''
          if old in text:text=text.replace(old,new,1)
          elif 'self._json(select_clips_payload(segments, payload))' not in text:raise SystemExit('manual clipper endpoint anchor missing')
          if '"/clipper-modes.js"' not in text:text=text.replace('"/transcription.js", "/styles.css"','"/transcription.js", "/clipper-modes.js", "/styles.css"',1)
          service.write_text(text,encoding='utf-8')

          bridge=Path('src/binario_marketing/transcription_service.py');text=bridge.read_text(encoding='utf-8')
          text='''from __future__ import annotations\n\nfrom .clipper_service import select_clips_payload\n\n\ndef select_transcript_clips(runtime,project_id:str,asset_id:str,payload:dict)->list[dict]:\n    rows=runtime.transcriptions.segments(project_id,asset_id)\n    return select_clips_payload(rows,payload)\n'''
          bridge.write_text(text,encoding='utf-8')

          html=Path('web/index.html');text=html.read_text(encoding='utf-8')
          if '<script src="/clipper-modes.js" defer></script>' not in text:
              anchor='  <script src="/transcription.js" defer></script>\n'
              if anchor not in text:raise SystemExit('transcription bundle anchor missing')
              text=text.replace(anchor,anchor+'  <script src="/clipper-modes.js" defer></script>\n',1)
          html.write_text(text,encoding='utf-8')

          app=Path('web/app.js');text=app.read_text(encoding='utf-8')
          old="body:{segments,target_count:Number($('#clipper-count').value),min_duration:Number($('#clipper-min').value),max_duration:Number($('#clipper-max').value)}"
          new="body:{segments,target_count:Number($('#clipper-count').value),min_duration:Number($('#clipper-min').value),max_duration:Number($('#clipper-max').value),...(globalThis.clipperModePayload?clipperModePayload():{})}"
          if old in text:text=text.replace(old,new,1)
          elif 'globalThis.clipperModePayload' not in text:raise SystemExit('manual clipper payload anchor missing')
          old="item.append(el('strong','',`${clip.start.toFixed(1)}–${clip.end.toFixed(1)}s · score ${clip.score}`),el('p','',clip.text));"
          new=old+"if(clip.tone)item.append(el('span','narrative-meta',`${clip.tone} · ${(clip.reasons||[]).join(' · ')}`));"
          if 'narrative-meta' not in text and old in text:text=text.replace(old,new,1)
          app.write_text(text,encoding='utf-8')

          ui=Path('web/transcription.js');text=ui.read_text(encoding='utf-8')
          old="body:{target_count:Number($('#clipper-count').value),min_duration:Number($('#clipper-min').value),max_duration:Number($('#clipper-max').value)}"
          new="body:{target_count:Number($('#clipper-count').value),min_duration:Number($('#clipper-min').value),max_duration:Number($('#clipper-max').value),...(globalThis.clipperModePayload?clipperModePayload():{})}"
          if old in text:text=text.replace(old,new,1)
          elif 'globalThis.clipperModePayload' not in text:raise SystemExit('transcript clipper payload anchor missing')
          old="item.append(el('strong','',`${clip.start.toFixed(1)}–${clip.end.toFixed(1)}s · score ${clip.score}`),el('p','',clip.text));"
          new=old+"if(clip.tone)item.append(el('span','narrative-meta',`${clip.tone} · ${(clip.reasons||[]).join(' · ')}`));"
          if 'narrative-meta' not in text and old in text:text=text.replace(old,new,1)
          ui.write_text(text,encoding='utf-8')

          smoke=Path('scripts/smoke_full_mac_transcription.sh');text=smoke.read_text(encoding='utf-8')
          text=text.replace("--data '{\"target_count\":1,\"min_duration\":1,\"max_duration\":30}'","--data '{\"target_count\":1,\"min_duration\":1,\"max_duration\":30,\"mode\":\"objective\",\"target_duration\":8}'",1)
          old="assert str(row.get('text','')).strip(),row\nprint('SMOKE PASS: automatic transcript-driven Clipper')"
          new="assert str(row.get('text','')).strip(),row\nassert row.get('tone') in {'educativo','accionable','narrativo','provocativo'},row\nassert isinstance(row.get('reasons'),list),row\nassert 'hook_score' in row and 'closure_score' in row and 'duration_fit' in row,row\nprint('SMOKE PASS: narrative objective-duration transcript-driven Clipper')"
          if old in text:text=text.replace(old,new,1)
          elif "row.get('tone')" not in text:raise SystemExit('native transcription clipper assertion anchor missing')
          smoke.write_text(text,encoding='utf-8')

          workflow=Path('.github/workflows/full-mac-app.yml');text=workflow.read_text(encoding='utf-8')
          if 'clipper-modes.js' not in text:
              anchor='''          /usr/bin/grep -q 'reorder_to' "$RUNNER_TEMP/visual-timeline.js"\n'''
              addition=anchor+'''          /usr/bin/curl --fail --silent "$BASE/clipper-modes.js" > "$RUNNER_TEMP/clipper-modes.js"\n          /usr/bin/grep -q 'clipperModePayload' "$RUNNER_TEMP/clipper-modes.js"\n'''
              if anchor not in text:raise SystemExit('FULL MAC visual bundle anchor missing')
              text=text.replace(anchor,addition,1)
          workflow.write_text(text,encoding='utf-8')
          PY
      - name: Validate narrative Clipper wiring
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python scripts/check_source_tree.py
          for script in scripts/*.sh; do bash -n "$script"; done
          for script in web/*.js; do node --check "$script"; done
          python -m unittest discover -s tests -v
          python -m compileall -q src scripts
      - name: Commit validated wiring and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/clipper-modes-wiring.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "clipper: wire natural and objective-duration modes end to end"
          git push origin HEAD:feature/clipper-narrative-modes
