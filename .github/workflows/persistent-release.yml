name: Persistent Mac Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "src/**"
      - "apps/**"
      - "web/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/persistent-release.yml"

permissions:
  contents: write

jobs:
  certify-current-runtime-x86:
    if: github.event_name == 'pull_request'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache verified FFmpeg runtime
        uses: actions/cache@v4
        with:
          path: .cache/full-mac-media-x86_64
          key: parity-media-${{ runner.os }}-x86_64-${{ hashFiles('scripts/full_mac_media_runtime.env') }}
      - name: Cache verified Whisper runtime
        uses: actions/cache@v4
        with:
          path: .cache/full-mac-whisper-x86_64
          key: parity-whisper-${{ runner.os }}-x86_64-${{ hashFiles('scripts/full_mac_transcription_runtime.env') }}
      - name: Build and audit x86 current runtime
        shell: bash
        env:
          FULL_MAC_FFMPEG_CACHE_DIR: ${{ github.workspace }}/.cache/full-mac-media-x86_64
          FULL_MAC_WHISPER_CACHE_DIR: ${{ github.workspace }}/.cache/full-mac-whisper-x86_64
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          scripts/build_full_mac_release_candidate.sh --arch x86_64
          scripts/audit_full_mac_app.sh "dist/Binario Marketing IA.app"
          scripts/audit_wave80_x86_runtime_parity.sh "dist/Binario Marketing IA.app"
      - name: Smoke W76 service on Intel
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/Binario Marketing IA.app"
          LOG="$RUNNER_TEMP/x86-parity-smoke.log"
          /usr/bin/grep -q 'service_wave76_app import serve' "$APP/Contents/Resources/launch.py"
          python - "$APP/Contents/Resources/BUILD_PROVENANCE.json" <<'PY'
          import json,sys
          row=json.load(open(sys.argv[1],encoding='utf-8'))
          assert row['architecture']=='x86_64', row
          assert row['product_version']=='0.9.0.dev1', row
          PY
          BINARIO_IA_HOME="$RUNNER_TEMP/x86-parity-data" BINARIO_NO_BROWSER=1 BINARIO_PORT=18767 \
            "$APP/Contents/MacOS/Binario Marketing IA" >"$LOG" 2>&1 &
          PID=$!
          cleanup(){ kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; }
          trap cleanup EXIT
          READY=0
          for _ in $(seq 1 80); do
            if /usr/bin/curl --fail --silent http://127.0.0.1:18767/api/health > "$RUNNER_TEMP/x86-health.json"; then READY=1; break; fi
            sleep 0.25
          done
          if [[ "$READY" != "1" ]]; then cat "$LOG"; exit 1; fi
          /usr/bin/grep -q '"status":"ok"' "$RUNNER_TEMP/x86-health.json"
          echo 'WAVE 80 X86_64 W76 SMOKE PASS'

  release-preflight:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify canonical release tag
        env:
          PYTHONPATH: src
        run: python scripts/verify_release_tag.py --tag "$GITHUB_REF_NAME"
      - name: Decode and verify exact physical UAT attestation
        env:
          PHYSICAL_UAT_ATTESTATION_B64: ${{ secrets.PHYSICAL_UAT_ATTESTATION_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PHYSICAL_UAT_ATTESTATION_B64" || { echo 'PHYSICAL UAT ATTESTATION MISSING'; exit 5; }
          mkdir -p release-evidence
          printf '%s' "$PHYSICAL_UAT_ATTESTATION_B64" | base64 --decode > release-evidence/combined-physical-uat-attestation.json
          python scripts/verify_combined_uat_attestation.py \
            --evidence release-evidence/combined-physical-uat-attestation.json \
            --expected-git-sha "$GITHUB_SHA"
      - name: Preserve verified physical UAT attestation for native builds
        uses: actions/upload-artifact@v4
        with:
          name: verified-physical-uat-attestation-${{ github.sha }}
          path: release-evidence/combined-physical-uat-attestation.json
          if-no-files-found: error
          retention-days: 7

  build-native:
    needs: release-preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrieve verified physical UAT attestation
        uses: actions/download-artifact@v4
        with:
          name: verified-physical-uat-attestation-${{ github.sha }}
          path: release-evidence
      - name: Cache verified FFmpeg runtime when available
        uses: actions/cache@v4
        with:
          path: .cache/full-mac-media-${{ matrix.arch }}
          key: release-media-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('scripts/full_mac_media_runtime.env') }}
      - name: Cache verified Whisper runtime when available
        uses: actions/cache@v4
        with:
          path: .cache/full-mac-whisper-${{ matrix.arch }}
          key: release-whisper-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('scripts/full_mac_transcription_runtime.env') }}
      - name: Build and audit native current-runtime candidate
        shell: bash
        env:
          FULL_MAC_FFMPEG_CACHE_DIR: ${{ github.workspace }}/.cache/full-mac-media-${{ matrix.arch }}
          FULL_MAC_WHISPER_CACHE_DIR: ${{ github.workspace }}/.cache/full-mac-whisper-${{ matrix.arch }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          scripts/build_full_mac_release_candidate.sh --arch "${{ matrix.arch }}"
          scripts/audit_full_mac_app.sh "dist/Binario Marketing IA.app"
      - name: Smoke bundled service
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/Binario Marketing IA.app"
          LOG="$RUNNER_TEMP/release-smoke.log"
          BINARIO_NO_BROWSER=1 BINARIO_PORT=18766 "$APP/Contents/MacOS/Binario Marketing IA" >"$LOG" 2>&1 &
          PID=$!
          cleanup(){ kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; }
          trap cleanup EXIT
          READY=0
          for _ in $(seq 1 60); do
            if /usr/bin/curl --fail --silent http://127.0.0.1:18766/api/health > "$RUNNER_TEMP/health.json"; then READY=1; break; fi
            sleep 0.25
          done
          if [[ "$READY" != "1" ]]; then cat "$LOG"; exit 1; fi
          /usr/bin/grep -q '"status":"ok"' "$RUNNER_TEMP/health.json"
          /usr/bin/grep -q 'service_wave76_app import serve' "$APP/Contents/Resources/launch.py"
      - name: Enforce production release candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_candidate_gate.py \
            --repo . \
            --app "dist/Binario Marketing IA.app" \
            --uat-evidence "release-evidence/combined-physical-uat-attestation.json" \
            --production
      - name: Package immutable release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          SAFE_TAG="${GITHUB_REF_NAME//\//-}"
          ZIP="release/Binario-Marketing-IA-${SAFE_TAG}-${{ matrix.arch }}.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "dist/Binario Marketing IA.app" "$ZIP"
          SHA="$(/usr/bin/shasum -a 256 "$ZIP" | /usr/bin/awk '{print $1}')"
          printf '%s  %s\n' "$SHA" "$(basename "$ZIP")" > "${ZIP}.sha256"
          printf '{"schema":"binario.marketing.release.v1","tag":"%s","git_sha":"%s","architecture":"%s","asset":"%s","sha256":"%s","runtime_wave":76,"certification_guard_wave":80}\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "${{ matrix.arch }}" "$(basename "$ZIP")" "$SHA" > "release/RELEASE-${{ matrix.arch }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: persistent-release-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  publish-release:
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: persistent-release-*
          path: release
          merge-multiple: true
      - name: Verify both architectures and checksums
        shell: bash
        run: |
          set -euo pipefail
          test -f release/RELEASE-arm64.json
          test -f release/RELEASE-x86_64.json
          cd release
          for checksum in *.zip.sha256; do sha256sum -c "$checksum"; done
      - name: Publish permanent GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "BINARIO Marketing $GITHUB_REF_NAME" \
            --generate-notes
