name: Full Mac App

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "apps/**"
      - "web/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/full-mac-app.yml"
  pull_request:
    paths:
      - "src/**"
      - "apps/**"
      - "web/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/full-mac-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache verified FFmpeg runtime
        uses: actions/cache@v4
        with:
          path: .cache/full-mac-media-${{ matrix.arch }}
          key: ffmpeg-8.1.2-${{ runner.os }}-${{ matrix.arch }}-38b88335f99e76ed89ff3c93f877fdefce736c13
      - name: Build native app
        shell: bash
        env:
          FULL_MAC_FFMPEG_CACHE_DIR: ${{ github.workspace }}/.cache/full-mac-media-${{ matrix.arch }}
        run: |
          set -euo pipefail
          chmod +x scripts/bootstrap_full_mac_python.sh scripts/build_embedded_ffmpeg.sh scripts/build_full_mac_app.sh scripts/audit_full_mac_app.sh
          LOG="$RUNNER_TEMP/full-mac-build-${{ matrix.arch }}.log"
          scripts/build_full_mac_app.sh --arch "${{ matrix.arch }}" 2>&1 | /usr/bin/tee "$LOG"
      - name: Preserve build diagnostics
        if: failure()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/full-mac-build-${{ matrix.arch }}.log"
          {
            echo '### FULL MAC build failure — ${{ matrix.arch }}'
            echo '```text'
            /usr/bin/tail -n 160 "$LOG" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-mac-build-diagnostics-${{ matrix.arch }}
          path: ${{ runner.temp }}/full-mac-build-${{ matrix.arch }}.log
          if-no-files-found: warn
      - name: Audit bundle
        run: scripts/audit_full_mac_app.sh "dist/Binario Marketing IA.app"
      - name: Smoke boot local API from bundled runtimes
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/Binario Marketing IA.app"
          MEDIA="$APP/Contents/Resources/runtime/media/bin"
          "$MEDIA/ffmpeg" -hide_banner -version > "$RUNNER_TEMP/ffmpeg-version.txt"
          "$MEDIA/ffprobe" -hide_banner -version > "$RUNNER_TEMP/ffprobe-version.txt"
          /usr/bin/head -n 1 "$RUNNER_TEMP/ffmpeg-version.txt"
          /usr/bin/head -n 1 "$RUNNER_TEMP/ffprobe-version.txt"
          LOG="$RUNNER_TEMP/binario-smoke.log"
          BINARIO_NO_BROWSER=1 BINARIO_PORT=18765 "$APP/Contents/MacOS/Binario Marketing IA" >"$LOG" 2>&1 &
          PID=$!
          cleanup(){ kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; }
          trap cleanup EXIT
          READY=0
          for _ in $(seq 1 60); do
            if /usr/bin/curl --fail --silent http://127.0.0.1:18765/api/health > "$RUNNER_TEMP/health.json"; then READY=1; break; fi
            sleep 0.25
          done
          if [[ "$READY" != "1" ]]; then cat "$LOG"; exit 1; fi
          /usr/bin/grep -q '"status":"ok"' "$RUNNER_TEMP/health.json"
          /usr/bin/curl --fail --silent http://127.0.0.1:18765/api/apps > "$RUNNER_TEMP/apps.json"
          /usr/bin/curl --fail --silent http://127.0.0.1:18765/api/runtime > "$RUNNER_TEMP/runtime.json"
          "$APP/Contents/Resources/runtime/python/bin/python3" -I -B - "$RUNNER_TEMP/apps.json" "$RUNNER_TEMP/runtime.json" <<'PY'
          import json, sys
          apps=json.load(open(sys.argv[1], encoding='utf-8'))
          runtime=json.load(open(sys.argv[2], encoding='utf-8'))
          assert len(apps)==12, len(apps)
          by_name={row['name']: row for row in runtime}
          for name in ('ffmpeg','ffprobe'):
              row=by_name[name]
              assert row['available'] is True, row
              assert '/runtime/media/bin/' in row['location'], row
          print('SMOKE PASS: 12/12 apps + embedded ffmpeg/ffprobe')
          PY
      - name: Package and hash
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Binario-Marketing-IA-${{ matrix.arch }}-${GITHUB_SHA::12}.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "dist/Binario Marketing IA.app" "$ZIP"
          /usr/bin/shasum -a 256 "$ZIP" > "$ZIP.sha256"
          printf '{"git_sha":"%s","architecture":"%s","artifact":"%s","ffmpeg":"8.1.2","ffmpeg_commit":"38b88335f99e76ed89ff3c93f877fdefce736c13"}\n' "$GITHUB_SHA" "${{ matrix.arch }}" "$ZIP" > FULL_MAC_DELIVERY.json
      - uses: actions/upload-artifact@v4
        with:
          name: binario-marketing-full-mac-${{ matrix.arch }}
          path: |
            Binario-Marketing-IA-*.zip
            Binario-Marketing-IA-*.zip.sha256
            FULL_MAC_DELIVERY.json
          if-no-files-found: error
