name: Full Mac App · arm64 iteration

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "apps/**"
      - "web/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/full-mac-app.yml"
  pull_request:
    paths:
      - "src/**"
      - "apps/**"
      - "web/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/full-mac-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-smoke-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache verified FFmpeg runtime
        uses: actions/cache@v4
        with:
          path: .cache/full-mac-media-arm64
          key: ffmpeg-8.1.2-${{ runner.os }}-arm64-38b88335f99e76ed89ff3c93f877fdefce736c13

      - name: Cache verified Whisper runtime
        uses: actions/cache@v4
        with:
          path: .cache/full-mac-whisper-arm64
          key: whisper-${{ runner.os }}-arm64-${{ hashFiles('scripts/full_mac_transcription_runtime.env') }}

      - name: Build Wave 47 arm64 app
        shell: bash
        env:
          FULL_MAC_FFMPEG_CACHE_DIR: ${{ github.workspace }}/.cache/full-mac-media-arm64
          FULL_MAC_WHISPER_CACHE_DIR: ${{ github.workspace }}/.cache/full-mac-whisper-arm64
        run: |
          set -euo pipefail
          chmod +x \
            scripts/bootstrap_full_mac_python.sh \
            scripts/build_embedded_ffmpeg.sh \
            scripts/build_embedded_whisper.sh \
            scripts/audit_embedded_whisper.sh \
            scripts/build_full_mac_app.sh \
            scripts/build_full_mac_wave47.sh \
            scripts/audit_full_mac_app.sh \
            scripts/smoke_full_mac_transcription.sh
          LOG="$RUNNER_TEMP/full-mac-build-arm64.log"
          scripts/build_full_mac_wave47.sh --arch arm64 2>&1 | /usr/bin/tee "$LOG"

      - name: Preserve build diagnostics
        if: failure()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/full-mac-build-arm64.log"
          {
            echo '### FULL MAC Wave 47 arm64 build failure'
            echo '```text'
            /usr/bin/tail -n 180 "$LOG" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Audit bundle and embedded runtime
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/Binario Marketing IA.app"
          scripts/audit_full_mac_app.sh "$APP"
          bash scripts/audit_embedded_whisper.sh "$APP" arm64
          bash scripts/audit_wave47_product_surface.sh "$APP"

      - name: Smoke product shell, company workspace and real render
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/Binario Marketing IA.app"
          PY="$APP/Contents/Resources/runtime/python/bin/python3"
          MEDIA="$APP/Contents/Resources/runtime/media/bin"
          DATA="$RUNNER_TEMP/binario-wave47-smoke"
          BASE="http://127.0.0.1:18765"
          LOG="$RUNNER_TEMP/binario-wave47-smoke.log"

          BINARIO_IA_HOME="$DATA" BINARIO_NO_BROWSER=1 BINARIO_PORT=18765 \
            "$APP/Contents/MacOS/Binario Marketing IA" >"$LOG" 2>&1 &
          PID=$!
          cleanup(){ kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 80); do
            if /usr/bin/curl --fail --silent "$BASE/api/health" > "$RUNNER_TEMP/health.json"; then READY=1; break; fi
            sleep 0.25
          done
          if [[ "$READY" != "1" ]]; then cat "$LOG"; exit 1; fi
          /usr/bin/grep -q '"status":"ok"' "$RUNNER_TEMP/health.json"

          /usr/bin/curl --fail --silent "$BASE/product-shell.js" > "$RUNNER_TEMP/product-shell.js"
          /usr/bin/grep -q 'renderWave47Pauta' "$RUNNER_TEMP/product-shell.js"
          /usr/bin/grep -q 'renderWave47Video' "$RUNNER_TEMP/product-shell.js"

          /usr/bin/curl --fail --silent -X POST -H 'Content-Type: application/json' \
            --data '{"name":"Wave 47 Smoke Company"}' "$BASE/api/companies" > "$RUNNER_TEMP/company.json"
          COMPANY_ID="$("$PY" -I -B -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["id"])' "$RUNNER_TEMP/company.json")"

          /usr/bin/curl --fail --silent "$BASE/api/companies/$COMPANY_ID/workspace" > "$RUNNER_TEMP/workspace-before.json"
          "$PY" -I -B -c 'import json,sys; assert json.load(open(sys.argv[1],encoding="utf-8"))["project_id"] is None' "$RUNNER_TEMP/workspace-before.json"
          /usr/bin/curl --fail --silent -X POST -H 'Content-Type: application/json' --data '{}' \
            "$BASE/api/companies/$COMPANY_ID/workspace" > "$RUNNER_TEMP/workspace.json"
          PROJECT_ID="$("$PY" -I -B -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["project_id"])' "$RUNNER_TEMP/workspace.json")"
          test -n "$PROJECT_ID"

          SOURCE="$RUNNER_TEMP/wave47-source.mp4"
          "$MEDIA/ffmpeg" -hide_banner -loglevel error -f lavfi -i 'testsrc2=size=640x360:rate=24' -t 0.8 -c:v mpeg4 -an -y "$SOURCE"
          /usr/bin/curl --fail --silent -X POST -H 'Content-Type: video/mp4' --data-binary @"$SOURCE" \
            "$BASE/api/projects/$PROJECT_ID/assets/upload?filename=wave47-source.mp4&kind=video" > "$RUNNER_TEMP/asset.json"
          ASSET_ID="$("$PY" -I -B -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["id"])' "$RUNNER_TEMP/asset.json")"

          /usr/bin/curl --fail --silent -X POST -H 'Content-Type: application/json' \
            --data "{\"asset_id\":\"$ASSET_ID\",\"start\":0,\"end\":0.5,\"aspect\":\"9:16\",\"label\":\"wave47-smoke\"}" \
            "$BASE/api/projects/$PROJECT_ID/renders" > "$RUNNER_TEMP/render-start.json"
          JOB_ID="$("$PY" -I -B -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["id"])' "$RUNNER_TEMP/render-start.json")"
          STATUS=""
          for _ in $(seq 1 120); do
            /usr/bin/curl --fail --silent "$BASE/api/renders/$JOB_ID" > "$RUNNER_TEMP/render.json"
            STATUS="$("$PY" -I -B -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["status"])' "$RUNNER_TEMP/render.json")"
            case "$STATUS" in PASS|FAIL|CANCELLED|INTERRUPTED) break ;; esac
            sleep 0.25
          done
          if [[ "$STATUS" != "PASS" ]]; then cat "$RUNNER_TEMP/render.json"; cat "$LOG"; exit 1; fi
          /usr/bin/curl --fail --silent "$BASE/api/renders/$JOB_ID/file" > "$RUNNER_TEMP/rendered.mp4"
          test -s "$RUNNER_TEMP/rendered.mp4"
          echo 'WAVE 47 ARM64 SMOKE PASS: company workspace + product shell + real vertical render'

      - name: Package and hash arm64 candidate
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "Binario Marketing IA.app" "Binario-Marketing-IA-W47-arm64.zip"
          /usr/bin/shasum -a 256 "Binario-Marketing-IA-W47-arm64.zip" > "Binario-Marketing-IA-W47-arm64.zip.sha256"
          cat "Binario-Marketing-IA-W47-arm64.zip.sha256"

      - name: Upload arm64 iteration artifact
        uses: actions/upload-artifact@v4
        with:
          name: binario-marketing-wave47-arm64
          path: |
            dist/Binario-Marketing-IA-W47-arm64.zip
            dist/Binario-Marketing-IA-W47-arm64.zip.sha256
          if-no-files-found: error
