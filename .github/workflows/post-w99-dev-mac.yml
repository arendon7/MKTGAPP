name: Post-W99 Dev Mac · arm64

on:
  pull_request:
    paths:
      - "src/binario_marketing/service_post_w99_*.py"
      - "src/binario_marketing/social_background.py"
      - "src/binario_marketing/social_process_lock.py"
      - "web/primary-navigation.js"
      - "web/social-background-control.js"
      - "scripts/build_post_w99_dev_mac_app.sh"
      - "scripts/audit_post_w99_dev_mac_app.sh"
      - ".github/workflows/post-w99-dev-mac.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-smoke-post-w99-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache verified FFmpeg runtime
        uses: actions/cache@v4
        with:
          path: .cache/full-mac-media-arm64
          key: ffmpeg-8.1.2-${{ runner.os }}-arm64-38b88335f99e76ed89ff3c93f877fdefce736c13

      - name: Cache verified Whisper runtime
        uses: actions/cache@v4
        with:
          path: .cache/full-mac-whisper-arm64
          key: whisper-${{ runner.os }}-arm64-${{ hashFiles('scripts/full_mac_transcription_runtime.env') }}

      - name: Build isolated post-W99 development app
        shell: bash
        env:
          FULL_MAC_FFMPEG_CACHE_DIR: ${{ github.workspace }}/.cache/full-mac-media-arm64
          FULL_MAC_WHISPER_CACHE_DIR: ${{ github.workspace }}/.cache/full-mac-whisper-arm64
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          scripts/build_post_w99_dev_mac_app.sh --arch arm64 --out "$RUNNER_TEMP/post-w99-dist"

      - name: Audit development-only identity
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/post-w99-dist/Binario Marketing IA Post-W99 Dev.app"
          scripts/audit_post_w99_dev_mac_app.sh "$APP"

      - name: Smoke post-W99 terminal and background status
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/post-w99-dist/Binario Marketing IA Post-W99 Dev.app"
          DATA="$RUNNER_TEMP/post-w99-smoke-data"
          BASE="http://127.0.0.1:18766"
          LABEL="com.sistemabinario.marketing.social-scheduler"
          PLIST="$HOME/Library/LaunchAgents/$LABEL.plist"
          test ! -f "$PLIST"

          LOG="$RUNNER_TEMP/post-w99-smoke.log"
          BINARIO_IA_HOME="$DATA" BINARIO_NO_BROWSER=1 BINARIO_PORT=18766 \
            "$APP/Contents/MacOS/Binario Marketing IA" >"$LOG" 2>&1 &
          PID=$!
          cleanup(){ kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 80); do
            if /usr/bin/curl --fail --silent "$BASE/api/health" > "$RUNNER_TEMP/health.json"; then READY=1; break; fi
            sleep 0.25
          done
          if [[ "$READY" != "1" ]]; then cat "$LOG"; exit 1; fi
          /usr/bin/grep -q '"status":"ok"' "$RUNNER_TEMP/health.json"

          /usr/bin/curl --fail --silent "$BASE/api/social/background" > "$RUNNER_TEMP/background.json"
          /usr/bin/curl --fail --silent "$BASE/primary-navigation.js" > "$RUNNER_TEMP/primary-navigation.js"
          /usr/bin/curl --fail --silent "$BASE/social-background-control.js" > "$RUNNER_TEMP/social-background-control.js"
          /usr/bin/grep -q 'platform_supported' "$RUNNER_TEMP/background.json"
          /usr/bin/grep -q 'POST_W99_PRIMARY_NAVIGATION' "$RUNNER_TEMP/primary-navigation.js"
          /usr/bin/grep -q 'Activar en este Mac' "$RUNNER_TEMP/social-background-control.js"
          /usr/bin/grep -q 'window.confirm' "$RUNNER_TEMP/social-background-control.js"
          test ! -f "$PLIST"
          echo 'POST-W99 DEV MAC SMOKE PASS: terminal + Calendar background status; no automatic LaunchAgent install'

      - name: Package development artifact
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/post-w99-dist"
          /usr/bin/ditto -c -k --keepParent "Binario Marketing IA Post-W99 Dev.app" "$RUNNER_TEMP/Binario-Marketing-IA-Post-W99-Dev-arm64.zip"
          /usr/bin/shasum -a 256 "$RUNNER_TEMP/Binario-Marketing-IA-Post-W99-Dev-arm64.zip"

      - name: Upload post-W99 development app
        uses: actions/upload-artifact@v4
        with:
          name: binario-marketing-post-w99-dev-arm64
          path: ${{ runner.temp }}/Binario-Marketing-IA-Post-W99-Dev-arm64.zip
          if-no-files-found: error
          retention-days: 7
