name: Reconcile Runtime Source

on:
  push:
    branches:
      - fix/transcription-reconciliation
    paths:
      - scripts/reconcile_incomplete_features.py
      - .github/workflows/reconcile-runtime-minimal.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile actual product source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reconcile_incomplete_features.py
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_full_mac_app.sh')
          text=p.read_text(encoding='utf-8')
          text=text.replace('export PATH="$TRANSCRIPTION/bin:$MEDIA_BIN:$RESOURCES/runtime/python/bin:/usr/bin:/bin"','export PATH="$MEDIA_BIN:$TRANSCRIPTION/bin:$RESOURCES/runtime/python/bin:/usr/bin:/bin"')
          p.write_text(text,encoding='utf-8')
          PY
      - name: Validate canonical source
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_source_tree.py
          for script in scripts/*.sh; do bash -n "$script"; done
          for script in web/*.js; do node --check "$script"; done
          python -m unittest discover -s tests -v
          python -m compileall -q src scripts
      - name: Commit reconciled source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: reconcile standalone transcription and narrative clipper source"
          git push origin HEAD:fix/transcription-reconciliation
